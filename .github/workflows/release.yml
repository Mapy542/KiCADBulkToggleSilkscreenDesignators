name: Build and Release

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Build package
              run: |
                  chmod +x build-package.sh
                  ./build-package.sh

            - name: Compute package metadata
              id: pkg
              run: |
                  echo "sha256=$(sha256sum kicad-package.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
                  echo "download_size=$(stat -c%s kicad-package.zip)" >> "$GITHUB_OUTPUT"
                  echo "install_size=$(unzip -l kicad-package.zip | tail -1 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
                  echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Update packages.json
              env:
                  VERSION: ${{ steps.pkg.outputs.version }}
                  SHA256: ${{ steps.pkg.outputs.sha256 }}
                  DOWNLOAD_SIZE: ${{ steps.pkg.outputs.download_size }}
                  INSTALL_SIZE: ${{ steps.pkg.outputs.install_size }}
                  TAG: ${{ github.ref_name }}
                  REPO: ${{ github.repository }}
              run: |
                  python3 - <<'EOF'
                  import json, os

                  with open("packages.json") as f:
                      data = json.load(f)

                  new_version = {
                      "version": os.environ["VERSION"],
                      "status": "stable",
                      "kicad_version": "6.0",
                      "download_url": f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}/kicad-package.zip",
                      "download_sha256": os.environ["SHA256"],
                      "download_size": int(os.environ["DOWNLOAD_SIZE"]),
                      "install_size": int(os.environ["INSTALL_SIZE"])
                  }

                  versions = data["packages"][0]["versions"]
                  versions = [v for v in versions if v["version"] != os.environ["VERSION"]]
                  versions.insert(0, new_version)
                  data["packages"][0]["versions"] = versions

                  with open("packages.json", "w") as f:
                      json.dump(data, f, indent=4)
                      f.write("\n")
                  EOF

            - name: Build resources.zip
              run: |
                  IDENTIFIER=$(python3 -c "import json; print(open('metadata.json').read())" | python3 -c "import json,sys; print(json.load(sys.stdin)['identifier'])")
                  mkdir -p resources_build/${IDENTIFIER}
                  cp icon-64x64.png resources_build/${IDENTIFIER}/icon.png
                  cd resources_build && zip -r ../resources.zip *

            - name: Update repository.json
              run: |
                  python3 - <<'EOF'
                  import json, hashlib, datetime, os

                  now = datetime.datetime.utcnow()
                  timestamp = int(now.timestamp())
                  update_time = now.strftime("%Y-%m-%d %H:%M:%S")

                  with open("repository.json") as f:
                      repo = json.load(f)

                  with open("packages.json", "rb") as f:
                      repo["packages"]["sha256"] = hashlib.sha256(f.read()).hexdigest()
                  repo["packages"]["update_timestamp"] = timestamp
                  repo["packages"]["update_time_utc"] = update_time

                  with open("resources.zip", "rb") as f:
                      repo["resources"]["sha256"] = hashlib.sha256(f.read()).hexdigest()
                  repo["resources"]["update_timestamp"] = timestamp
                  repo["resources"]["update_time_utc"] = update_time

                  with open("repository.json", "w") as f:
                      json.dump(repo, f, indent=4)
                      f.write("\n")
                  EOF

            - name: Commit updated packages.json and repository.json
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add packages.json repository.json resources.zip
                  git commit -m "chore: update packages.json, repository.json, resources.zip for ${{ github.ref_name }}"
                  git push origin HEAD:master

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: kicad-package.zip
                  generate_release_notes: true
